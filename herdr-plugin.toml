id = "herdr-usage-popup"
name = "Usage Popup"
version = "0.2.0"
min_herdr_version = "0.7.4"
description = "Model usage percentages as plain bars in a popup panel"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open model usage"
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-usage-popup --entrypoint usage --focus"]

[[panes]]
id = "usage"
title = "Model usage"
placement = "popup"
width = 70
height = 18
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/usage.sh\""]
