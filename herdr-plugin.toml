id = "herdr-omp-usage"
name = "OMP Usage"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Model usage percentages from oh-my-pi (omp) as plain bars in a popup panel"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open model usage"
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-omp-usage --entrypoint usage --focus"]

[[panes]]
id = "usage"
title = "Model usage"
placement = "popup"
width = 70
height = 18
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/usage.sh\""]
